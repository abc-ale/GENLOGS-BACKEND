# JWT
jwt.secret=${JWT_SECRET}
# El token JWT que se genere va a durar 24 horas antes de expirar
jwt.expiration=86400000

# CORS: origenes permitidos separados por coma (en Render: variable CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://genlogs-frontend-kym5.onrender.com,http://localhost:5173,http://127.0.0.1:5173}

# URL publica del frontend (se usa para armar el enlace del correo de recuperacion)
app.frontend-url=${FRONTEND_URL:https://genlogs-frontend-kym5.onrender.com}

# Correo (Brevo por HTTPS). Si BREVO_API_KEY esta vacia, el enlace se imprime en los logs.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:GenLogs}

# Conexión a PostgreSQL (Supabase - pooler, modo transacción)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Subida de archivos (el valor por defecto de Spring es 1MB y rechaza imagenes normales)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Factiliza: autocompletado de RUC/DNI al registrar un cliente/proveedor (RF-08).
# Si FACTILIZA_API_KEY esta vacia, el servicio responde con datos simulados (modo demo)
# para no bloquear el desarrollo del frontend mientras se gestiona la cuenta real.
factiliza.api-key=${FACTILIZA_API_KEY:}
factiliza.base-url=${FACTILIZA_BASE_URL:https://api.factiliza.com/v1}

# Bloqueo automatico de usuario tras intentos fallidos de login seguidos (RF-28).
app.security.max-intentos-fallidos=${MAX_INTENTOS_FALLIDOS:5}
